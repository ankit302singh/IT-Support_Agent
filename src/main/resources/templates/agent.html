<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT Support Agent</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body p-5">

            <h1 class="text-center mb-2">
                🛠️ IT Support Agent
            </h1>

            <p class="text-center text-muted mb-4">
                Describe your laptop problem and get a solution
            </p>

            <!-- Question Form -->
            <form action="/agent" method="get">

                <div class="mb-3">

                    <label for="query" class="form-label">
                        What problem are you facing?
                    </label>

                    <input
                        type="text"
                        id="query"
                        name="query"
                        class="form-control"
                        placeholder="Example: Bluetooth is not working"
                        required>

                </div>

                <div class="d-grid">

                    <button type="submit" class="btn btn-primary">
                        🔍 Ask Agent
                    </button>

                </div>

            </form>

            <!-- Response -->
            <div class="mt-4">

                <h5>🔧 Solution</h5>

				<div th:if="${solution != null}" class="mt-4">

				    <h5>🔧 Solution</h5>

				    <div class="alert alert-secondary">
				        <pre style="white-space: pre-wrap; font-family: inherit;"
				             th:text="${solution}"></pre>
				    </div>

				</div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
