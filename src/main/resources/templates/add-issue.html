<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Issue | IT Support</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">


<!-- Header -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid px-4">

        <span class="navbar-brand fw-semibold">
            IT Support
        </span>

        <span class="text-white">
            Admin Portal
        </span>

    </div>

</nav>


<!-- Main -->

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">


            <div class="mb-4">

                <h2 class="fw-bold">
                    Add Troubleshooting Issue
                </h2>

                <p class="text-muted">
                    Add a new problem and its troubleshooting solution
                    to the IT Support knowledge base.
                </p>

            </div>


            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">


                    <form action="/admin/issues/create"
                          method="post">


                        <!-- Issue -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Issue
                            </label>

                            <input
                                type="text"
                                name="issue"
                                class="form-control"
                                placeholder="Example: Bluetooth Not Working"
                                required>

                            <div class="form-text">
                                Name of the problem employees may face.
                            </div>

                        </div>


                        <!-- Keywords -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Keywords
                            </label>

                            <input
                                type="text"
                                name="keywords"
                                class="form-control"
                                placeholder="bluetooth, bluetooth not working, bluetooth missing"
                                required>

                            <div class="form-text">
                                Separate multiple keywords using commas.
                            </div>

                        </div>


                        <!-- Solution -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Troubleshooting Solution
                            </label>

                            <textarea
                                name="solution"
                                class="form-control"
                                rows="7"
                                placeholder="Enter the troubleshooting steps..."
                                required></textarea>

                        </div>


                        <!-- Driver Name -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Driver Name
                            </label>

                            <input
                                type="text"
                                name="driverName"
                                class="form-control"
                                placeholder="Example: Intel Bluetooth Driver">

                        </div>


                        <!-- Driver URL -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Driver Download URL
                            </label>

                            <input
                                type="url"
                                name="driverUrl"
                                class="form-control"
                                placeholder="https://example.com/driver">

                        </div>


                        <!-- Buttons -->

                        <div class="d-flex justify-content-end gap-2">

                            <a href="/admin"
                               class="btn btn-outline-secondary">

                                Cancel

                            </a>


                            <button
                                type="submit"
                                class="btn btn-primary">

                                Save Issue

                            </button>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
