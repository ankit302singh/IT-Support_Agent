<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IT Support Admin</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<!-- ================= HEADER ================= -->

<nav class="navbar navbar-dark bg-dark shadow-sm">

    <div class="container">

        <span class="navbar-brand mb-0 h1">
            🛠️ IT Support Admin
        </span>

        <span class="text-white">
            Issue Management
        </span>

    </div>

</nav>


<!-- ================= MAIN CONTENT ================= -->

<div class="container mt-5 mb-5">


    <!-- Page Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">
                Troubleshooting Issues
            </h2>

            <p class="text-muted mb-0">
                Manage IT support problems and solutions
            </p>

        </div>


		<a href="/admin/issues/new"
		   class="btn btn-primary">

		    ➕ Add New Issue

		</a>

    </div>


    <!-- ================= ISSUE TABLE ================= -->

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>

                            <th>Issue</th>

                            <th>Keywords</th>

                            <th>Driver</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody>

                        <tr th:each="issue : ${issues}">

                            <!-- ID -->

                            <td th:text="${issue.id}">
                            </td>


                            <!-- Issue -->

                            <td>

                                <strong
                                    th:text="${issue.issue}">
                                </strong>

                            </td>


                            <!-- Keywords -->

                            <td>

                                <span
                                    th:each="keyword : ${issue.keywords}"
                                    class="badge text-bg-light border me-1"
                                    th:text="${keyword.keyword}">
                                </span>

                            </td>


                            <!-- Driver -->

                            <td th:text="${issue.driverName}">
                            </td>


                            <!-- Actions -->

                            <td>

                                <button
                                    class="btn btn-sm btn-outline-primary me-1">

                                    ✏️ Edit

                                </button>


                                <button
                                    class="btn btn-sm btn-outline-danger">

                                    🗑️ Delete

                                </button>

                            </td>

                        </tr>


                        <!-- No Issues -->

                        <tr th:if="${#lists.isEmpty(issues)}">

                            <td colspan="5"
                                class="text-center text-muted py-4">

                                No troubleshooting issues found.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- Footer -->

    <div class="text-center text-muted mt-4">

        <small>
            IT Support Agent • Admin Panel
        </small>

    </div>


</div>


</body>

</html>
